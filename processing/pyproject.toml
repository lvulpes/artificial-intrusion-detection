[project]
name = "extraction"
version = "0.1.0"
description = "Session-level traffic features from attacker/victim pcaps"
requires-python = ">=3.11"
dependencies = [
    "dpkt>=1.9.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "pyyaml>=6.0",
    "scipy>=1.11",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
