services:
  metasploitable:
    image: tleemcjr/metasploitable2:latest
    container_name: metasploitable
    tty: true
    # Metasploitable2 needs its services started manually upon boot
    command: sh -c "/bin/services.sh && tail -f /dev/null"
    networks:
      lab_net:
        ipv4_address: 10.10.10.10

  attacker:
    build:
        context: .
        dockerfile: Dockerfile.attacker
    container_name: attacker
    tty: true
    # nmap's binary carries file capabilities (incl. cap_net_admin) that exceed
    # Docker's default capability set, which makes the kernel refuse to exec it.
    # Granting these keeps nmap -A / OS detection working in the container.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      # Point AutoPentester's OpenAI-compatible client at the Ollama VM on the LAN.
      # - OPENAI_BASE_URL=http://172.16.25.10:11434/v1
      - OPENAI_BASE_URL=https://openrouter.ai/api/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
        - ./pcaps:/root/pcaps:Z
        - /home/hugin/code/AutoPentester:/root/autopentester:Z
    networks:
      lab_net:
        ipv4_address: 10.10.10.20

networks:
  lab_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24

